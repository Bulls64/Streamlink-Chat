name: Live check

# Chaque jour, se connecte en lecture seule aux vrais Twitch, Kick et Steam TV (packaging/live_check.py).
# En cas d'échec, ouvre un ticket (un seul à la fois) ; le ferme quand tout repasse.
# Every day, connects read-only to the real Twitch, Kick and Steam TV (packaging/live_check.py).
# On failure, opens an issue (only one at a time); closes it when everything passes again.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Real platforms
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Connect to Twitch, Kick and Steam TV
        id: check
        continue-on-error: true
        run: python packaging/live_check.py --summary live-summary.md
      - name: Job summary
        if: always()
        run: cat live-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Open or update the issue on failure
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live check: a platform no longer answers as expected"
          {
            echo "The daily check could not read at least one platform ($(date -u +%F))."
            echo
            cat live-summary.md
            echo
            echo "Run: $RUN_URL"
          } > body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
          exit 1
      - name: Close the issue when everything passes again
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Live check: a platform no longer answers as expected"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "All platforms answer again ($(date -u +%F))."
          fi
