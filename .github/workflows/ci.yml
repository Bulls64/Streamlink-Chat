name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all modules
        run: python -m compileall -q chat slink_chat.py
      - name: Static analysis (ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install ruff==0.17.0
          python -m ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test (Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3-tk
          xvfb-run -a python -m unittest tests.test_gui -v

  build:
    name: Build the .exe
    # Sur chaque PR (pour vérifier que l'exe se construit) et sur les tags de version
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Read the version (and check the tag)
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import chat; print(chat.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match chat.__version__ ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build (PyInstaller bootloader compiled from source)
        shell: cmd
        env:
          BUILD_BOOTLOADER: "1"
          PY: python
        run: packaging\build_exe.bat
      - name: Check that the bootloader was really compiled here
        run: python packaging/check_bootloader.py
      - name: Rename the executable
        shell: bash
        run: mv "dist/Streamlink Chat.exe" "dist/StreamlinkChat-${{ steps.version.outputs.version }}.exe"
      - name: Upload the unsigned executable
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/StreamlinkChat-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

  appimage:
    name: Build the Linux AppImage
    # Même règle que l'exe : à chaque PR et à chaque tag de version
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    # Ubuntu 22.04 : l'AppImage fonctionne ensuite avec la glibc 2.35 ou plus récente
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the tag
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' chat/__init__.py)
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match chat.__version__ ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install the build dependencies (Tcl/Tk with Xft)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libx11-dev libxft-dev libxss-dev libfontconfig-dev patchelf xvfb
      - name: Build
        run: bash packaging/appimage/build_appimage.sh dist
      - name: Smoke test (starts the AppImage under Xvfb)
        run: |
          APP="dist/StreamlinkChat-$VERSION-x86_64.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          mkdir -p "$HOME"
          # La fenêtre doit tenir 8 s sans erreur ; timeout l'arrête ensuite (code 124 = attendu)
          set +e
          xvfb-run -a timeout 8 "$APP" > run.log 2>&1
          code=$?
          set -e
          cat run.log
          fail() { echo "::error::$1"; sed 's/^/::error::  /' run.log | head -40; exit 1; }
          [ "$code" = "124" ] || fail "The AppImage exited early (code $code)"
          ! grep -q "Traceback" run.log || fail "Python traceback at start-up"
          [ -f "$XDG_CONFIG_HOME/streamlink-chat/chat.log" ] || fail "No data written to $XDG_CONFIG_HOME/streamlink-chat"
      - name: Check the glibc requirement
        run: |
          mkdir x && cd x && "../dist/StreamlinkChat-$VERSION-x86_64.AppImage" --appimage-extract >/dev/null
          NEED=$(find squashfs-root/usr/python -name "*.so*" -o -path "*/bin/python3*" -type f | xargs objdump -T 2>/dev/null \
            | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1)
          echo "::notice::AppImage requires $NEED"
          [ "$(printf '%s\n' "$NEED" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "::error::$NEED > GLIBC_2.35"; exit 1; }
      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/StreamlinkChat-${{ env.VERSION }}-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, appimage]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      EXE: StreamlinkChat-${{ needs.build.outputs.version }}.exe
      APPIMAGE: StreamlinkChat-${{ needs.build.outputs.version }}-x86_64.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.EXE }}
          path: unsigned
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.APPIMAGE }}
          path: linux
      - name: Gather the files
        shell: bash
        run: |
          mkdir -p dist
          cp "unsigned/$EXE" dist/
          cp "linux/$APPIMAGE" dist/
          cd dist && sha256sum "$EXE" "$APPIMAGE" > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          python packaging/release_notes.py "$VERSION" > release_notes.md
          HASH=$(sha256sum "dist/$EXE" | cut -d' ' -f1)
          HASH_LINUX=$(sha256sum "dist/$APPIMAGE" | cut -d' ' -f1)
          {
            echo
            echo "---"
            echo
            echo "**Unsigned executable** — Windows SmartScreen may show a warning (*More info* → *Run anyway*). *Exécutable non signé — SmartScreen peut afficher un avertissement (Informations complémentaires → Exécuter quand même).*"
            echo
            echo "**Linux:** \`$APPIMAGE\` — \`chmod +x\` then run it (glibc 2.35+, e.g. Ubuntu 22.04, Debian 12, Fedora 36 or newer; Streamlink must be installed). *Linux : rendre le fichier exécutable puis le lancer.*"
            echo
            echo "SHA-256 \`$EXE\` \`$HASH\`"
            echo
            echo "SHA-256 \`$APPIMAGE\` \`$HASH_LINUX\`"
          } >> release_notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: Streamlink Chat ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            dist/${{ env.EXE }}
            dist/${{ env.APPIMAGE }}
            dist/SHA256SUMS.txt
