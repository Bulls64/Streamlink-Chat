name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all modules
        run: python -m compileall -q chat slink_chat.py
      - name: Static analysis (ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install ruff==0.17.0
          python -m ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test (Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash packaging/ci_apt.sh xvfb python3-tk
          xvfb-run -a python -m unittest tests.test_gui -v

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Measure (all tests, interface included, under Xvfb)
        run: |
          bash packaging/ci_apt.sh xvfb python3-tk
          python -m pip install coverage==7.13.5
          xvfb-run -a python -m coverage run -m unittest discover -s tests
      - name: Report (fails under the threshold set in .coveragerc)
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report

  build:
    name: Build the .exe
    # Sur chaque PR (pour vérifier que l'exe se construit) et sur les tags de version
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Read the version (and check the tag)
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import chat; print(chat.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match chat.__version__ ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build (PyInstaller bootloader compiled from source)
        shell: cmd
        env:
          BUILD_BOOTLOADER: "1"
          PY: python
        run: packaging\build_exe.bat
      - name: Check that the bootloader was really compiled here
        run: python packaging/check_bootloader.py
      - name: Rename the executable
        shell: bash
        run: mv "dist/Streamlink Chat.exe" "dist/StreamlinkChat-${{ steps.version.outputs.version }}.exe"
      - name: Upload the unsigned executable
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/StreamlinkChat-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

  appimage:
    name: Build the Linux AppImage
    # Même règle que l'exe : à chaque PR et à chaque tag de version
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    # Ubuntu 22.04 : l'AppImage fonctionne ensuite avec la glibc 2.35 ou plus récente
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the tag
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' chat/__init__.py)
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match chat.__version__ ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install the build dependencies (Tcl/Tk with Xft)
        run: |
          bash packaging/ci_apt.sh build-essential libx11-dev libxft-dev libxss-dev libfontconfig-dev patchelf xvfb
      - name: Build
        run: bash packaging/appimage/build_appimage.sh dist
      - name: Smoke test (starts the AppImage under Xvfb)
        run: |
          APP="dist/StreamlinkChat-$VERSION-x86_64.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          mkdir -p "$HOME"
          # La fenêtre doit tenir 8 s sans erreur ; timeout l'arrête ensuite (code 124 = attendu)
          set +e
          xvfb-run -a timeout 8 "$APP" > run.log 2>&1
          code=$?
          set -e
          cat run.log
          fail() { echo "::error::$1"; sed 's/^/::error::  /' run.log | head -40; exit 1; }
          [ "$code" = "124" ] || fail "The AppImage exited early (code $code)"
          ! grep -q "Traceback" run.log || fail "Python traceback at start-up"
          [ -f "$XDG_CONFIG_HOME/streamlink-chat/chat.log" ] || fail "No data written to $XDG_CONFIG_HOME/streamlink-chat"
      - name: Check the glibc requirement
        run: |
          mkdir x && cd x && "../dist/StreamlinkChat-$VERSION-x86_64.AppImage" --appimage-extract >/dev/null
          NEED=$(find squashfs-root/usr/python -name "*.so*" -o -path "*/bin/python3*" -type f | xargs objdump -T 2>/dev/null \
            | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1)
          echo "::notice::AppImage requires $NEED"
          [ "$(printf '%s\n' "$NEED" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "::error::$NEED > GLIBC_2.35"; exit 1; }
      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/StreamlinkChat-${{ env.VERSION }}-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 7

  linux-packages:
    name: Build the .deb and .rpm packages
    # Même contenu que l'AppImage, installé dans /opt ; testés en vrai sur Ubuntu 22.04 (.deb) et Fedora (.rpm)
    # Same content as the AppImage, installed in /opt; really tested on Ubuntu 22.04 (.deb) and Fedora (.rpm)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: appimage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Version
        run: echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' chat/__init__.py)" >> "$GITHUB_ENV"
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: StreamlinkChat-${{ env.VERSION }}-x86_64.AppImage
          path: linux
      - name: Install rpmbuild and Xvfb
        run: bash packaging/ci_apt.sh rpm xvfb
      - name: Build
        run: |
          chmod +x "linux/StreamlinkChat-$VERSION-x86_64.AppImage"
          bash packaging/linux/build_packages.sh "linux/StreamlinkChat-$VERSION-x86_64.AppImage" dist
          dpkg-deb -I "dist/streamlink-chat_${VERSION}_amd64.deb"
          rpm -qpi "dist/streamlink-chat-$VERSION-1.x86_64.rpm"
          rpm -qpR "dist/streamlink-chat-$VERSION-1.x86_64.rpm"
      - name: Install and start the .deb (Ubuntu 22.04)
        run: |
          sudo apt-get install -y -qq --no-install-recommends "./dist/streamlink-chat_${VERSION}_amd64.deb"
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          mkdir -p "$HOME"
          touch "$RUNNER_TEMP/stamp"
          set +e
          xvfb-run -a timeout 8 streamlink-chat > run.log 2>&1
          code=$?
          set -e
          cat run.log
          fail() { echo "::error::$1"; sed 's/^/::error::  /' run.log | head -40; exit 1; }
          [ "$code" = "124" ] || fail "The .deb's chat exited early (code $code)"
          ! grep -q "Traceback" run.log || fail "Python traceback at start-up"
          [ -f "$XDG_CONFIG_HOME/streamlink-chat/chat.log" ] || fail "No data written to ~/.config"
          [ -z "$(find /opt/streamlink-chat -newer "$RUNNER_TEMP/stamp")" ] || fail "Data written to /opt"
          sudo apt-get remove -y -qq streamlink-chat
          [ ! -e /usr/bin/streamlink-chat ] || fail "The .deb did not uninstall cleanly"
      - name: Install and start the .rpm (Fedora 42)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:42 bash -euc '
            dnf install -y -q --setopt=install_weak_deps=False "/dist/streamlink-chat-'"$VERSION"'-1.x86_64.rpm" \
              xorg-x11-server-Xvfb >/dev/null
            Xvfb :99 -screen 0 1000x760x24 >/dev/null 2>&1 &
            sleep 2
            export DISPLAY=:99 HOME=/tmp/h XDG_CONFIG_HOME=/tmp/h/.config
            mkdir -p "$HOME"
            set +e
            timeout 8 streamlink-chat > /tmp/run.log 2>&1
            code=$?
            set -e
            cat /tmp/run.log
            [ "$code" = 124 ] || { echo "::error::The .rpm chat exited early (code $code)"; exit 1; }
            ! grep -q Traceback /tmp/run.log || { echo "::error::Python traceback at start-up"; exit 1; }
            [ -f /tmp/h/.config/streamlink-chat/chat.log ] || { echo "::error::No data in ~/.config"; exit 1; }
            # Lancé ici par root, qui peut écrire dans /opt : les données doivent quand même aller dans ~/.config
            # Started here by root, who can write to /opt: the data must still go to ~/.config
            [ ! -e /opt/streamlink-chat/app/chat.log ] || { echo "::error::Data written to /opt"; exit 1; }
            dnf remove -y -q streamlink-chat >/dev/null
            [ ! -e /usr/bin/streamlink-chat ] || { echo "::error::The .rpm did not uninstall cleanly"; exit 1; }'
      - name: Upload the .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/streamlink-chat_${{ env.VERSION }}_amd64.deb
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Upload the .rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/streamlink-chat-${{ env.VERSION }}-1.x86_64.rpm
          archive: false
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build the macOS app (.dmg)
    # Apple Silicon (arm64) ; l'app est démarrée pour de vrai et l'image disque montée pour vérification
    # Apple Silicon (arm64); the app is really started and the disk image mounted to check it
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Version
        run: echo "VERSION=$(python3 -c 'import chat; print(chat.__version__)')" >> "$GITHUB_ENV"
      - name: Build the .app and the .dmg
        run: bash packaging/macos/build_dmg.sh
      - name: Start the app
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          APP="dist/Streamlink Chat.app"
          "$APP/Contents/MacOS/Streamlink Chat" > run.log 2>&1 &
          pid=$!
          sleep 12
          alive=0; kill -0 "$pid" 2>/dev/null && alive=1
          screencapture -x shot.png 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat run.log
          fail() { echo "::error::$1"; exit 1; }
          [ "$alive" = 1 ] || fail "The app exited early"
          ! grep -q "Traceback" run.log || fail "Python traceback at start-up"
          [ -f "$HOME/Library/Application Support/Streamlink Chat/chat.log" ] || fail "No data in ~/Library/Application Support"
          # Rien n'a été écrit dans le bundle : sa signature est intacte / Nothing written to the bundle: signature intact
          codesign --verify --deep --strict "$APP" || fail "The app bundle was modified"
      - name: Check the disk image
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "dist/StreamlinkChat-$VERSION-macOS-arm64.dmg"
          ls -la "$RUNNER_TEMP/dmg"
          test -x "$RUNNER_TEMP/dmg/Streamlink Chat.app/Contents/MacOS/Streamlink Chat"
          test -L "$RUNNER_TEMP/dmg/Applications"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/dmg/Streamlink Chat.app/Contents/Info.plist" | grep -qx "$VERSION"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - name: Upload the screenshot
        if: always() && hashFiles('shot.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: macos-screenshot
          path: shot.png
          retention-days: 7
      - name: Upload the .dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: dist/StreamlinkChat-${{ env.VERSION }}-macOS-arm64.dmg
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, appimage, linux-packages, macos]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      EXE: StreamlinkChat-${{ needs.build.outputs.version }}.exe
      APPIMAGE: StreamlinkChat-${{ needs.build.outputs.version }}-x86_64.AppImage
      DEB: streamlink-chat_${{ needs.build.outputs.version }}_amd64.deb
      RPM: streamlink-chat-${{ needs.build.outputs.version }}-1.x86_64.rpm
      DMG: StreamlinkChat-${{ needs.build.outputs.version }}-macOS-arm64.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.EXE }}
          path: unsigned
      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.APPIMAGE }}
          path: linux
      - name: Download the .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.DEB }}
          path: linux
      - name: Download the .rpm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.RPM }}
          path: linux
      - name: Download the .dmg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ env.DMG }}
          path: macos
      - name: Gather the files
        shell: bash
        run: |
          mkdir -p dist
          cp "unsigned/$EXE" dist/
          cp "linux/$APPIMAGE" "linux/$DEB" "linux/$RPM" "macos/$DMG" dist/
          cd dist && sha256sum "$EXE" "$APPIMAGE" "$DEB" "$RPM" "$DMG" > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          python packaging/release_notes.py "$VERSION" > release_notes.md
          HASH=$(sha256sum "dist/$EXE" | cut -d' ' -f1)
          HASH_LINUX=$(sha256sum "dist/$APPIMAGE" | cut -d' ' -f1)
          {
            echo
            echo "---"
            echo
            echo "**Unsigned executable** — Windows SmartScreen may show a warning (*More info* → *Run anyway*). *Exécutable non signé — SmartScreen peut afficher un avertissement (Informations complémentaires → Exécuter quand même).*"
            echo
            echo "**Linux:** \`$APPIMAGE\` — \`chmod +x\` then run it (glibc 2.35+, e.g. Ubuntu 22.04, Debian 12, Fedora 36 or newer; Streamlink must be installed). *Linux : rendre le fichier exécutable puis le lancer.*"
            echo
            echo "**Packages:** \`$DEB\` (Debian, Ubuntu, Mint: \`sudo apt install ./$DEB\`) and \`$RPM\` (Fedora, openSUSE: \`sudo dnf install ./$RPM\`), same content as the AppImage, with a menu entry and the \`streamlink-chat\` command. *Paquets : même contenu que l'AppImage, avec une entrée de menu et la commande streamlink-chat.*"
            echo
            echo "**macOS (Apple Silicon):** \`$DMG\` — open it and drag *Streamlink Chat* onto *Applications*. The app is not notarized by Apple: the first time, open it, then allow it in *System Settings › Privacy & Security › Open Anyway*. *macOS (puces Apple) : ouvrir l'image, glisser l'app sur Applications ; au premier lancement, l'autoriser dans Réglages Système › Confidentialité et sécurité › Ouvrir quand même.*"
            echo
            echo "SHA-256 \`$EXE\` \`$HASH\`"
            echo
            echo "SHA-256 \`$APPIMAGE\` \`$HASH_LINUX\`"
            echo
            echo "SHA-256 \`$DEB\` \`$(sha256sum "dist/$DEB" | cut -d' ' -f1)\`"
            echo
            echo "SHA-256 \`$RPM\` \`$(sha256sum "dist/$RPM" | cut -d' ' -f1)\`"
            echo
            echo "SHA-256 \`$DMG\` \`$(sha256sum "dist/$DMG" | cut -d' ' -f1)\`"
          } >> release_notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: Streamlink Chat ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            dist/${{ env.EXE }}
            dist/${{ env.APPIMAGE }}
            dist/${{ env.DEB }}
            dist/${{ env.RPM }}
            dist/${{ env.DMG }}
            dist/SHA256SUMS.txt
